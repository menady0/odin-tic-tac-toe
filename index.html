<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="game-start">
      <h1>Tic Tac Toe</h1>
      <p>A classic game for two players</p>
      <form action="#">
        <div class="player">
          <label for="player1">Player 1 Name</label>
          <input type="text" id="player1" required />
        </div>
        <div class="player">
          <label for="player2">Player 2 Name</label>
          <input type="text" id="player2" required />
        </div>
        <button class="start-game" type="submit">Start Game</button>
      </form>
    </div>

    <!-- hide class here -->
    <div class="game hide">
      <header>
        <h1>Tic Tac Toe</h1>
        <p>A classic game for two players</p>
      </header>
      <div class="players">
        <div class="card player1">
          <i class="fa-solid fa-circle-xmark"></i>
          <p class="player1-name">Alex</p>
        </div>
        <div class="card player2">
          <i class="fa-solid fa-circle-dot"></i> 
          <p class="player2-name">Sam</p>
        </div>
      </div>
      <div class="controls">
        <div class="game-status">
          <i class="fa-solid fa-circle"></i>
          <p class="game-status-case">Alex's turn</p>
        </div>
        <button class="restart" type="button">
          <i class="fa-solid fa-arrow-rotate-right"></i> Restart Game
        </button>
      </div>
      <div class="board">
        <div class="cell" data-cell="0"></div>
        <div class="cell" data-cell="1"></div>
        <div class="cell" data-cell="2"></div>
        <div class="cell" data-cell="3"></div>
        <div class="cell" data-cell="4"></div>
        <div class="cell" data-cell="5"></div>
        <div class="cell" data-cell="6"></div>
        <div class="cell" data-cell="7"></div>
        <div class="cell" data-cell="8"></div>
      </div>
    </div>
  </body>
</html>
