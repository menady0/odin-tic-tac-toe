<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="game-start">
      <h1>Tic Tac Toe</h1>
      <p>A classic game for two players</p>
      <form action="#">
        <div class="player">
          <label for="player1">Player 1 Name</label>
          <input type="text" id="player1" required />
        </div>
        <div class="player">
          <label for="player2">Player 2 Name</label>
          <input type="text" id="player2" required />
        </div>
        <button class="start-game" type="submit">Start Game</button>
      </form>
    </div>
    <div class="game hide">
      <h1>Tic Tac Toe</h1>
      <p>A classic game for two players</p>
      <div class="players">
        <div class="player1">Player 1</div>
        <div class="player2">Player 2</div>
      </div>
      <div class="turn">
        <div class="game-status">Player 1 turn</div>
        <button class="restart">restart game</button>
      </div>
      <div class="parent">
        <div class="cell" data-cell="0"></div>
        <div class="cell" data-cell="1"></div>
        <div class="cell" data-cell="2"></div>
        <div class="cell" data-cell="3"></div>
        <div class="cell" data-cell="4"></div>
        <div class="cell" data-cell="5"></div>
        <div class="cell" data-cell="6"></div>
        <div class="cell" data-cell="7"></div>
        <div class="cell" data-cell="8"></div>
      </div>
    </div>
  </body>
</html>
